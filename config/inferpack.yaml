# InferPack Configuration
# Override any value with environment variables: INFERPACK_<SECTION>_<KEY>

server:
  host: "0.0.0.0"
  port: 9000
  grpc_port: 9001
  log_level: "info"

triton:
  host: "triton"
  http_port: 8000
  grpc_port: 8001
  model_repository: "/models"
  protocol: "grpc"   # "http" or "grpc"

model_lifecycle:
  idle_timeout_seconds: 300.0
  warmup_requests: 1
  lifecycle_check_interval_seconds: 30.0
  max_concurrent_loads: 1

execution:
  default_stage_timeout_seconds: 30.0
  default_max_retries: 0
  max_concurrent_executions: 10

builtin_pipelines_dir: "pipelines/builtins"
custom_pipelines_dir: "pipelines/custom"

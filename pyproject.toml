[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "inferpack"
version = "0.1.0"
description = "Production-grade AI inference runtime with ready-to-use pipelines"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "Pillow>=10.0,<12.0",
    "grpcio>=1.62,<2.0",
]

[project.optional-dependencies]
grpc = [
    "tritonclient[grpc]>=2.42",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
    "grpcio-tools>=1.62,<2.0",
    "tritonclient[grpc]>=2.42",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

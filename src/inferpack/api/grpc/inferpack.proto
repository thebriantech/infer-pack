syntax = "proto3";

package inferpack;

// ---------------------------------------------------------------------------
// Pipeline Service — mirrors the HTTP /api/v1/pipelines endpoints
// ---------------------------------------------------------------------------

service PipelineService {
  // List all registered pipelines.
  rpc ListPipelines(ListPipelinesRequest) returns (ListPipelinesResponse);

  // Activate a pipeline — loads its required models.
  rpc ActivatePipeline(PipelineRequest) returns (PipelineStatusResponse);

  // Deactivate a pipeline — releases model references.
  rpc DeactivatePipeline(PipelineRequest) returns (PipelineStatusResponse);

  // Execute a pipeline with the provided inputs.
  rpc ExecutePipeline(ExecutePipelineRequest) returns (ExecutePipelineResponse);

  // Execute face_detection pipeline with one image.
  rpc ExecuteFaceDetection(ExecuteFaceDetectionRequest) returns (ExecutePipelineResponse);

  // Execute face_comparison pipeline with two images.
  rpc ExecuteFaceComparison(ExecuteFaceComparisonRequest) returns (ExecutePipelineResponse);
}

// ---------------------------------------------------------------------------
// Messages
// ---------------------------------------------------------------------------

message ListPipelinesRequest {}

message PipelineSummary {
  string name = 1;
  string description = 2;
  string version = 3;
  bool builtin = 4;
  string state = 5;
  repeated string models = 6;
  repeated string stages = 7;
}

message ListPipelinesResponse {
  repeated PipelineSummary pipelines = 1;
}

message PipelineRequest {
  string name = 1;
}

message PipelineStatusResponse {
  string status = 1;
  string pipeline = 2;
}

message ExecutePipelineRequest {
  // Pipeline name to execute.
  string name = 1;

  // Binary image inputs keyed by name (e.g. "image_bytes", "image_bytes_1").
  map<string, bytes> image_inputs = 2;

  // Additional JSON-encoded inputs merged into the execution context.
  string inputs_json = 3;
}

message ExecuteFaceDetectionRequest {
  bytes image = 1;
}

message ExecuteFaceComparisonRequest {
  bytes image_1 = 1;
  bytes image_2 = 2;
}

message StageResult {
  string name = 1;
  string status = 2;
  double duration_seconds = 3;
  string error = 4;
}

message ExecutePipelineResponse {
  string pipeline_name = 1;
  bool success = 2;
  repeated StageResult stages = 3;
  double total_duration_seconds = 4;
  string error = 5;
  // JSON-serialised output dictionary.
  string output_json = 6;
}

# =========================================================================
# InferPack — Docker Compose
# =========================================================================
# Single-node, single-GPU deployment.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
# =========================================================================

name: inferpack

services:
  # -----------------------------------------------------------------------
  # Triton Inference Server (Inference Plane)
  # -----------------------------------------------------------------------
  triton:
    build:
      context: ..
      dockerfile: docker/Dockerfile.triton
    container_name: inferpack-triton
    restart: unless-stopped
    ports:
      - "28000:8000"   # HTTP
      - "28001:8001"   # gRPC
      - "28002:8002"   # Metrics
    volumes:
      - ../models:/models:ro
    # gpus: all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - inferpack-net

  # -----------------------------------------------------------------------
  # InferPack Runtime (Control Plane + Execution Plane + API)
  # -----------------------------------------------------------------------
  inferpack:
    build:
      context: ..
      dockerfile: docker/Dockerfile.inferpack
    container_name: inferpack-runtime
    restart: unless-stopped
    ports:
      - "29000:9000"
      - "29001:9001"   # gRPC
    environment:
      - INFERPACK_CONFIG=/app/config/inferpack.yaml
      - INFERPACK_TRITON_HOST=triton
      - INFERPACK_TRITON_HTTP_PORT=8000
      - INFERPACK_TRITON_GRPC_PORT=8001
      - INFERPACK_SERVER_HOST=0.0.0.0
      - INFERPACK_SERVER_PORT=9000
      - INFERPACK_SERVER_GRPC_PORT=9001
      - INFERPACK_SERVER_LOG_LEVEL=info
    volumes:
      # Mount custom pipelines directory for hot-loading user pipelines
      - ../pipelines/custom:/app/pipelines/custom:ro
    depends_on:
      triton:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:9000/api/v1/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - inferpack-net

networks:
  inferpack-net:
    driver: bridge
